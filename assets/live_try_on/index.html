<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Try-On</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* عكس الصورة بالـ CSS بدل الـ SDK (معالجة الـ SDK كانت تسبب تعليق الفيديو) */
    video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
  </style>
</head>
<body>
<!-- صفحة البث فقط: كل النصوص والأزرار في فلاتر حسب لغة التطبيق -->
<video id="output" autoplay playsinline muted></video>

<script type="module">
  import { createDecartClient, models } from "https://esm.sh/@decartai/sdk";

  const video = document.getElementById("output");
  let realtimeClient = null;
  let localStream = null;
  let frameWatch = null;
  let frameCount = 0;
  let frameLoopStarted = false;

  // تسجيل توقف الفيديو (لتشخيص التعليق)
  video.addEventListener("stalled", () => console.warn("[live_try_on] video stalled"));

  // ========== إرسال رسالة إلى فلاتر (جوال: WebView handler / ويب: postMessage) ==========
  function send(type, data = {}) {
    const msg = { source: "live_try_on", type, ...data };
    if (window.flutter_inappwebview?.callHandler) {
      window.flutter_inappwebview.callHandler("liveTryOn", JSON.stringify(msg));
    } else {
      window.parent.postMessage(JSON.stringify(msg), "*");
    }
  }

  // ========== مراقبة الإطارات: يطبع في الـ Console عدد الإطارات المعروضة كل 5 ثوانٍ ==========
  function startFrameWatch() {
    stopFrameWatch();
    frameCount = 0;

    // حلقة عدّ واحدة فقط طوال عمر الصفحة
    if (!frameLoopStarted && "requestVideoFrameCallback" in video) {
      frameLoopStarted = true;
      const count = () => {
        frameCount++;
        video.requestVideoFrameCallback(count);
      };
      video.requestVideoFrameCallback(count);
    }

    frameWatch = setInterval(() => {
      if (frameCount === 0) {
        console.warn("[live_try_on] no frames displayed in the last 5s (الفيديو متعلق)");
      } else {
        console.log(`[live_try_on] displayed fps: ${(frameCount / 5).toFixed(1)}`);
      }
      frameCount = 0;
    }, 5000);
  }

  function stopFrameWatch() {
    if (frameWatch) clearInterval(frameWatch);
    frameWatch = null;
  }

  // تحميل صورة العباية كملف (Decart يقبل File/Blob)
  async function loadGarment(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("garment_load_failed");
    const blob = await res.blob();
    return new File([blob], "abaya.jpg", { type: blob.type || "image/jpeg" });
  }

  async function applyGarment(imageUrl, prompt) {
    if (!realtimeClient) return;
    const image = await loadGarment(imageUrl);
    console.log("[live_try_on] applying garment...");
    await realtimeClient.set({ prompt, image, enhance: false });
    console.log("[live_try_on] garment applied");
    send("garment_applied");
  }

  async function start({ apiKey, imageUrl, prompt }) {
    try {
      send("connecting");
      const model = models.realtime("lucy-vton-latest");

      localStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { frameRate: model.fps, width: model.width, height: model.height },
      });
      // الدقة ومعدل الإطارات التي اشتغلت بها الكاميرا فعلاً
      console.log("[live_try_on] camera:", localStream.getVideoTracks()[0]?.getSettings());

      const client = createDecartClient({ apiKey });
      realtimeClient = await client.realtime.connect(localStream, {
        model,
        onRemoteStream: (edited) => {
          // نربط البث مرة واحدة فقط (إعادة الربط تقطع التشغيل)
          if (video.srcObject !== edited) {
            video.srcObject = edited;
            video.onloadedmetadata = () =>
              video.play().catch((e) => console.warn("[live_try_on] play:", e));

            // تسجيل حالة الفيديو الراجع من Decart
            edited.getVideoTracks().forEach((track) => {
              track.onmute = () => console.warn("[live_try_on] remote video muted (لا تصل إطارات من Decart)");
              track.onunmute = () => console.log("[live_try_on] remote video resumed");
              track.onended = () => console.warn("[live_try_on] remote video ended");
            });
          }
          startFrameWatch();
        },
        onError: (err) => {
          console.error("[live_try_on] error:", err);
          send("error", { message: String(err?.message ?? err) });
        },
        onDisconnect: (reason) => {
          console.warn("[live_try_on] disconnected:", reason);
          stopFrameWatch();
          send("stopped");
        },
      });

      await applyGarment(imageUrl, prompt);
      send("live");
    } catch (err) {
      console.error("[live_try_on] start failed:", err);
      const message = String(err?.name ?? err?.message ?? err);
      stop(false);
      send("error", { message });
    }
  }

  function stop(notify = true) {
    stopFrameWatch();
    try { realtimeClient?.disconnect(); } catch (_) {}
    realtimeClient = null;
    localStream?.getTracks().forEach((t) => t.stop());
    localStream = null;
    video.srcObject = null;
    if (notify) send("stopped");
  }

  // ========== استقبال الأوامر من فلاتر ==========
  async function receive(raw) {
    let msg;
    try { msg = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (_) { return; }
    if (!msg || msg.target !== "live_try_on") return;

    if (msg.type === "start") await start(msg);
    if (msg.type === "stop") stop();
    if (msg.type === "garment") {
      try { await applyGarment(msg.imageUrl, msg.prompt); }
      catch (err) { send("error", { message: String(err?.message ?? err) }); }
    }
  }

  window.liveTryOnReceive = receive; // للجوال
  window.addEventListener("message", (e) => receive(e.data)); // للويب
  window.addEventListener("pagehide", () => stop(false));

  // إبلاغ فلاتر بأن الصفحة جاهزة (الويب داخل iframe فوراً، الجوال بعد جاهزية جسر WebView)
  if (window.parent !== window || window.flutter_inappwebview?.callHandler) {
    send("ready");
  } else {
    window.addEventListener("flutterInAppWebViewPlatformReady", () => send("ready"), { once: true });
  }
</script>
</body>
</html>
